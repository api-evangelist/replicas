    CodexResponseItemPayload:
      type: object
      description: Payload for `response_item` events — structured items from the Codex response stream.
      oneOf:
      - type: object
        title: AssistantMessage
        description: A text message from the Codex agent.
        properties:
          type:
            type: string
            const: message
          role:
            type: string
            const: assistant
          content:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  const: output_text
                text:
                  type: string
                  description: The text content
              required:
              - type
              - text
        required:
        - type
        - role
        - content
      - type: object
        title: FunctionCall
        description: A function call by the Codex agent (shell commands, plan updates).
        properties:
          type:
            type: string
            const: function_call
          call_id:
            type: string
            description: Unique ID for this call, referenced by the corresponding `function_call_output`
          name:
            type: string
            enum:
            - shell
            - shell_command
            - exec_command
            - update_plan
            description: Function name
          arguments:
            type: string
            description: 'JSON-encoded arguments (e.g. `{"command": "ls -la"}` for shell commands, `{"plan": [...]}` for plan updates)'
        required:
        - type
        - call_id
        - name
        - arguments
      - type: object
        title: FunctionCallOutput
        description: Output from a previously invoked function call.
        properties:
          type:
            type: string
            const: function_call_output
          call_id:
            type: string
            description: ID of the function_call this output corresponds to
          output:
            type: string
            description: Raw output string. For shell commands this may include exit codes and stdout/stderr.
        required:
        - type
        - call_id
        - output
      - type: object
        title: CustomToolCall
        description: A custom tool invocation (e.g. `apply_patch` for file edits).
        properties:
          type:
            type: string
            const: custom_tool_call
          call_id:
            type: string
            description: Unique ID for this call
          name:
            type: string
            description: Tool name (e.g. `apply_patch`)
          input:
            type: string
            description: Tool input (e.g. patch content for `apply_patch`)
          status:
            type: string
            enum:
            - in_progress
            - completed
            - failed
            description: Current execution status
        required:
        - type
        - call_id
        - name
        - input
      - type: object
        title: CustomToolCallOutput
        description: Output from a custom tool call.
        properties:
          type:
            type: string
            const: custom_tool_call_output
          call_id:
            type: string
            description: ID of the custom_tool_call this output corresponds to
          output:
            type: string
            description: JSON-encoded output with optional `metadata.exit_code`
        required:
        - type
        - call_id
        - output
      discriminator:
        propertyName: type
