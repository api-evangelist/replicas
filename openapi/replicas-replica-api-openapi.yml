            slack:
              type: boolean
            google:
              type: boolean
          required:
          - github
          - gitlab
          - linear
          - slack
          - google
          description: Integration connection statuses
        coding_agents:
          type: object
          properties:
            claude:
              type: object
              properties:
                available:
                  type: boolean
                auth_method:
                  type: string
              required:
              - available
              - auth_method
            codex:
              type: object
              properties:
                available:
                  type: boolean
                auth_method:
                  type: string
              required:
              - available
              - auth_method
            opencode:
              type: object
              properties:
                available:
                  type: boolean
                auth_method:
                  type: string
              required:
              - available
              - auth_method
            pi:
              type: object
              properties:
                available:
                  type: boolean
                auth_method:
                  type: string
              required:
              - available
              - auth_method
            cursor:
              type: object
              properties:
                available:
                  type: boolean
                auth_method:
                  type: string
              required:
              - available
              - auth_method
          required:
          - claude
          - codex
          - cursor
          - opencode
          - pi
          description: Available coding agents and their authentication methods
        hooks:
          type: object
          properties:
            global_warm_hook:
              type: object
              properties:
                status:
                  type: string
                details:
                  type:
                  - string
                  - 'null'
              required:
              - status
              - details
            repositories:
              type: array
              items:
                type: object
                properties:
                  repository_name:
                    type: string
                  warm_hook:
                    type: string
                  start_hook:
                    type: string
                required:
                - repository_name
                - warm_hook
                - start_hook
          required:
          - global_warm_hook
          - repositories
          description: Hook configuration and status
        last_updated_at:
          type: string
          format: date-time
          description: When the environment was last updated
      required:
      - engine_version
      - files_uploaded
      - env_vars_set
      - skills_installed
      - integrations
      - coding_agents
      - hooks
      - last_updated_at
    CreateWorkspaceChatResponse:
      type: object
      properties:
        chat:
          $ref: '#/components/schemas/WorkspaceChat'
      required:
      - chat
    PiAgentEvent:
      type: object
      description: A streaming event from the Pi coding agent. Pi events expose session lifecycle, text and reasoning updates, tool execution, and errors.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        type:
          type: string
          pattern: ^pi-
          description: Pi event type. Common values include pi-message_update, pi-tool_execution_start, pi-tool_execution_update, pi-tool_execution_end, and pi-error.
        payload:
          type: object
          description: Pi event payload. Shape depends on the parent event type.
          additionalProperties: true
      required:
      - timestamp
      - type
      - payload
    ReorderQueueRequest:
      type: object
      description: Request to move a queued message to a new position.
      properties:
        messageId:
          type: string
          description: Queued message ID.
        position:
          type: integer
          description: Zero-based target position.
      required:
      - messageId
      - position
    CodexEventMsgPayload:
      type: object
      description: Payload for `event_msg` events — high-level user or reasoning messages.
      properties:
        type:
          type: string
          enum:
          - user_message
          - agent_reasoning
          description: '`user_message` for user input, `agent_reasoning` for the agent''s chain-of-thought'
        message:
          type: string
          description: User message text (present when type is `user_message`)
        text:
          type: string
          description: Reasoning text (present when type is `agent_reasoning`)
      required:
      - type
    EngineStatusSnapshot:
      type: object
      description: A snapshot of the engine's current status
      properties:
        uptimeSeconds:
          type: number
          description: Engine uptime in seconds
        hasActiveSSHSessions:
          type: boolean
          description: Whether there are active SSH sessions
        activeSseClients:
          type: integer
          description: Number of active SSE client connections
        chatsTotal:
          type: integer
          description: Total number of chat sessions
        chatsProcessing:
          type: integer
          description: Number of chats currently doing work, including those running background/spawned-agent tasks
        reposTotal:
          type: integer
          description: Total number of repositories
        hooksRunning:
          type: boolean
          description: Whether hooks are currently running
        desktopReady:
          type: boolean
          description: Whether the sandbox's noVNC desktop port is accepting connections. The desktop stack boots after wake, so this can lag behind engine readiness. Absent on older engines that do not report it.
      required:
      - uptimeSeconds
      - hasActiveSSHSessions
      - activeSseClients
      - chatsTotal
      - chatsProcessing
      - reposTotal
      - hooksRunning
    ClaudeContentBlock:
      type: object
      description: A single content block within a Claude message. Discriminated by `type`.
      oneOf:
      - type: object
        title: TextBlock
        description: A text response from the model.
        properties:
          type:
            type: string
            const: text
          text:
            type: string
            description: The text content
        required:
        - type
        - text
      - type: object
        title: ThinkingBlock
        description: An extended-thinking block showing the model's reasoning.
        properties:
          type:
            type: string
            const: thinking
          text:
            type: string
            description: The thinking/reasoning content
        required:
        - type
        - text
      - type: object
        title: ToolUseBlock
        description: A tool invocation by the model (e.g. Bash, Edit, Write, Grep, Glob, Read, WebSearch, TaskCreate, Skill).
        properties:
          type:
            type: string
            const: tool_use
          id:
            type: string
            description: Unique ID for this tool use, referenced by subsequent tool_result blocks
          name:
            type: string
            description: Tool name (e.g. `Bash`, `Edit`, `Write`, `Read`, `Grep`, `Glob`, `WebSearch`, `TaskCreate`, `Skill`)
          input:
            type: object
            additionalProperties: true
            description: Tool-specific input parameters
        required:
        - type
        - id
        - name
        - input
      - type: object
        title: ToolResultBlock
        description: The result of a tool invocation, sent back to the model in `claude-user` events.
        properties:
          type:
            type: string
            const: tool_result
          tool_use_id:
            type: string
            description: ID of the tool_use block this result corresponds to
          content:
            description: Tool output — either a plain string or an array of text/image blocks.
            oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - text
                    - image
                  text:
                    type: string
                  source:
                    type: object
                    properties:
                      type:
                        type: string
                      media_type:
                        type: string
                      data:
                        type: string
                        description: Base64-encoded image data
          is_error:
            type: boolean
            description: Whether the tool execution resulted in an error
        required:
        - type
        - tool_use_id
      discriminator:
        propertyName: type
    ArchiveWorkspaceResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the workspace was archived
      required:
      - success
    HistoryEvent:
      type: object
      description: A conversation history event
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        type:
          type: string
          description: Type of event (e.g., 'claude-user', 'claude-assistant', 'codex-user', 'cursor-assistant')
        payload:
          $ref: '#/components/schemas/AgentEvent'
          description: Event payload — see AgentEvent for the full discriminated schema
      required:
      - timestamp
      - type
      - payload
    ReplicaChat:
      type: object
      description: A chat session within a replica
      properties:
        id:
          type: string
          description: Unique identifier for the chat
        provider:
          type: string
          description: Coding agent provider for this chat
          enum:
          - claude
          - codex
          - cursor
          - opencode
          - pi
        title:
          type: string
          description: Chat title
        created_at:
          type: string
          format: date-time
          description: When the chat was created
        updated_at:
          type: string
          format: date-time
          description: When the chat was last updated
        processing:
          type: boolean
          description: Whether the chat is currently doing work — either processing a foreground message or running background/spawned-agent tasks
      required:
      - id
      - provider
      - title
      - created_at
      - updated_at
      - processing
    AgentEvent:
      description: A raw event from the coding agent, streamed as part of `chat.turn.delta` events. The shape depends on the coding agent provider. Use the `type` field to discriminate between Claude, Codex, Cursor, Opencode, and Pi events.
      oneOf:
      - $ref: '#/components/schemas/ClaudeAgentEvent'
      - $ref: '#/components/schemas/CodexAgentEvent'
      - $ref: '#/components/schemas/CursorAgentEvent'
      - $ref: '#/components/schemas/OpencodeAgentEvent'
      - $ref: '#/components/schemas/PiAgentEvent'
      discriminator:
        propertyName: type
        mapping:
          claude-assistant: '#/components/schemas/ClaudeAgentEvent'
          claude-user: '#/components/schemas/ClaudeAgentEvent'
          claude-result: '#/components/schemas/ClaudeAgentEvent'
          claude-system: '#/components/schemas/ClaudeAgentEvent'
          event_msg: '#/components/schemas/CodexAgentEvent'
          response_item: '#/components/schemas/CodexAgentEvent'
          cursor-assistant: '#/components/schemas/CursorAgentEvent'
          cursor-thinking: '#/components/schemas/CursorAgentEvent'
          cursor-tool_call: '#/components/schemas/CursorAgentEvent'
          cursor-task: '#/components/schemas/CursorAgentEvent'
          cursor-status: '#/components/schemas/CursorAgentEvent'
          cursor-error: '#/components/schemas/CursorAgentEvent'
          opencode-message.updated: '#/components/schemas/OpencodeAgentEvent'
          opencode-session.idle: '#/components/schemas/OpencodeAgentEvent'
          opencode-error: '#/components/schemas/OpencodeAgentEvent'
          opencode-part-text: '#/components/schemas/OpencodeAgentEvent'
          opencode-part-reasoning: '#/components/schemas/OpencodeAgentEvent'
          opencode-part-tool: '#/components/schemas/OpencodeAgentEvent'
          pi-agent_start: '#/components/schemas/PiAgentEvent'
          pi-message_update: '#/components/schemas/PiAgentEvent'
          pi-tool_execution_start: '#/components/schemas/PiAgentEvent'
          pi-tool_execution_update: '#/components/schemas/PiAgentEvent'
          pi-tool_execution_end: '#/components/schemas/PiAgentEvent'
          pi-error: '#/components/schemas/PiAgentEvent'
    QueueMutationResponse:
      type: object
      description: Result of a queue mutation.
      properties:
        success:
          type: boolean
          description: Whether the queue mutation changed the queue.
        queue:
          type: array
          items:
            $ref: '#/components/schemas/QueuedMessageInfo'
      required:
      - success
      - queue
    SlashCommandsResponse:
      type: object
      description: Available slash commands for a chat
      properties:
        commands:
          type: array
          items:
            $ref: '#/components/schemas/SlashCommand'
      required:
      - commands
    DeleteReplicaResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the deletion was successful
      required:
      - success
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service unavailable - The service is temporarily overloaded or under maintenance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Bad gateway - The workspace is unreachable or returned an invalid response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request - Missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict - Resource already exists or operation conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key authentication. Obtain your API key from the Replicas dashboard under Organization → Settings → API Keys.
    engineSecret:
      type: http
      scheme: bearer
      description: Workspace engine secret used by agent-mode workspace requests.
    workspaceId:
      type: apiKey
      in: header
      name: X-Workspace-Id
      description: Workspace ID used with the engine secret for agent-mode workspace requests.
