openapi: 3.1.0
info:
  title: Analytics Replica API
  version: 2.0.0
  description: The Replica API allows you to programmatically manage cloud workspaces for AI agents. Use this API to manage environments (the org-scoped primitive workspaces are created from — including variables, files, skills, MCPs, warm hooks, start hooks, and warm pools), create and manage replicas, send messages, manage chats, stream events, read connected repositories and repository sets, and configure automations.
servers:
- url: https://api.tryreplicas.com
  description: Production API
security:
- apiKey: []
tags:
- name: Replica
  description: Manage replicas (workspaces) for AI agents
paths:
  /v1/replica:
    post:
      operationId: createReplica
      summary: Create Replica
      description: Creates a new replica in your organization and sends an initial message to the coding agent. The workspace and agent are initialized asynchronously.
      tags:
      - Replica
      parameters:
      - name: X-Replicas-Api-Version
        in: header
        description: Optional dated API version. When omitted, the request blocks until the workspace reaches `active` and the response includes the populated engine details (legacy behavior). When set to `2026-05-17`, the request returns immediately with a `preparing` workspace; the initial message is still delivered to the agent in the background. See the [API Versioning](/features/api#api-versioning) section for details.
        required: false
        schema:
          type: string
          enum:
          - '2026-05-17'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplicaRequest'
      responses:
        '201':
          description: Replica created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReplicaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Repository or repository set not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listReplicas
      summary: List Replicas
      description: Returns a paginated list of all replicas in your organization. Supports filtering by user, source, and status. For this API endpoint, results are ordered by newest `created_at` first, except `status=archived` results are ordered by most recent activity (`last_activity_at`, falling back to `created_at`).
      tags:
      - Replica
      parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: user_id
        in: query
        description: Filter replicas by the user who created them
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: Filter replicas by creation source
        required: false
        schema:
          type: string
          enum:
          - api
          - dashboard
          - slack
          - linear
          - github
          - gitlab
          - automation
      - name: status
        in: query
        description: Filter replicas by status
        required: false
        schema:
          type: string
          enum:
          - active
          - sleeping
          - archived
          - preparing
          - error
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReplicasResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}:
    get:
      operationId: getReplica
      summary: Get Replica
      description: 'Returns detailed information about a specific replica by its ID. Use the `include` query parameter to request additional data such as environment configuration and diffs. If the workspace is sleeping or archived, it will be woken and the response will indicate this with `waking: true`.'
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        description: Comma-separated list of additional fields to include in the response
        required: false
        schema:
          type: string
          example: environment,diffs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReplicaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      operationId: deleteReplica
      summary: Delete Replica
      description: Deletes a replica by its ID. This terminates the underlying sandbox and processes any outstanding billing.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Replica deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteReplicaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}/messages:
    post:
      operationId: sendReplicaMessage
      summary: Send Message
      description: Sends a message to an existing replica. Supports targeting a specific chat, choosing a coding agent and model, attaching images, and enabling plan mode.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendReplicaMessageRequest'
      responses:
        '200':
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendReplicaMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/replica/{id}/chats:
    get:
      operationId: listReplicaChats
      summary: List Chats
      description: Returns a list of chats for a replica.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReplicaChat'
                  waking:
                    type: boolean
                    description: If true, the workspace was sleeping or archived and is now waking up. Retry after 30-90 seconds.
                required:
                - chats
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createReplicaChat
      summary: Create Chat
      description: Creates a new chat session for a replica.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaChat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}/chats/{chatId}:
    delete:
      operationId: deleteReplicaChat
      summary: Delete Chat
      description: Deletes a chat session from a replica.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        description: The unique identifier of the chat
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Chat deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}/chats/{chatId}/slash-commands:
    get:
      operationId: listReplicaSlashCommands
      summary: List Slash Commands
      description: Returns built-in Replicas slash commands and agent-provided commands for a chat, including Claude, Codex ASP, Cursor, Opencode, and Pi commands.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        description: The unique identifier of the chat
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlashCommandsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/replica/{id}/chats/{chatId}/queue:
    get:
      operationId: getReplicaChatQueue
      summary: Get Chat Queue
      description: Returns queued messages for a chat. The currently processing message is not included.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        description: The unique identifier of the chat
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Queue retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: clearReplicaChatQueue
      summary: Clear Chat Queue
      description: Removes all queued messages from a chat. The currently processing message is not interrupted.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        description: The unique identifier of the chat
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Queue cleared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}/chats/{chatId}/queue/{messageId}:
    delete:
      operationId: removeReplicaChatQueueMessage
      summary: Remove Queued Message
      description: Removes one queued message from a chat.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        description: The unique identifier of the chat
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        description: The unique identifier of the queued message
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Queued message removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMutationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}/chats/{chatId}/queue/reorder:
    patch:
      operationId: reorderReplicaChatQueue
      summary: Reorder Chat Queue
      description: Moves a queued message to a new zero-based position.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        description: The unique identifier of the chat
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderQueueRequest'
      responses:
        '200':
          description: Queue reordered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/replica/{id}/history:
    get:
      operationId: readReplicaHistory
      summary: Read History
      description: 'Reads the conversation history for a replica with pagination from the end (bottom-up). Optionally filter by chat ID. If the workspace is sleeping or archived, it will be woken and the response will indicate this with `waking: true`. Retry in 30-90 seconds when waking.'
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: chat_id
        in: query
        description: Filter history to a specific chat
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of events to return
        required: false
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        description: Number of events to skip from the end
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadReplicaHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/replica/{id}/hooks:
    get:
      operationId: getReplicaHooks
      summary: Get Hook Logs
      description: Returns the warm hook and start hook execution logs for a replica.
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HooksResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/replica/{id}/canvas:
    get:
      operationId: listReplicaCanvasItems
      summary: List Canvas Items
      description: 'Lists the items in the replica''s Canvas (files agents drop into `~/.replicas/canvas/`). Each item has a `kind` (markdown, html, image, video, audio, or other) inferred from its extension and a `sizeBytes` measured at list time. Files larger than 5 MB are still listed; the `getReplicaCanvasItem` endpoint will return `tooLarge: true` for them so callers know to fall back to `replicas media upload`.'
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/replica/{id}/canvas/{filename}:
    get:
      operationId: getReplicaCanvasItem
      summary: Get Canvas Item
      description: 'Reads a single Canvas item by filename. Text kinds (`markdown`, `html`) return UTF-8 text in `content`. Binary kinds (`image`, `video`, `audio`, `other`) return base64 in `base64`. Items over the 5 MB per-file cap return `tooLarge: true` with neither payload; callers should reach for `replicas media upload` for those.'
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      - name: filename
        in: path
        description: The Canvas item filename, including extension (e.g. `example-plan.md`).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasContentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/replica/{id}/events:
    get:
      operationId: streamReplicaEvents
      summary: Stream Events
      description: 'Opens a Server-Sent Events (SSE) stream for real-time events from a replica. The connection remains open and events are pushed as they occur.


        Each event is delivered as an SSE message in the format `data: <JSON>\n\n`. A heartbeat ping is sent every 15 seconds to keep the connection alive. Clients should reconnect automatically on disconnect.


        All events share a common envelope structure with `id` (unique event ID), `ts` (ISO 8601 timestamp), `type` (event type discriminator), and `payload` (type-specific data). See the `EngineEvent` schema for all possible event types.'
      tags:
      - Replica
      parameters:
      - name: id
        in: path
        description: The unique identifier of the replica
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: SSE event stream opened successfully. Each line is a JSON-encoded `EngineEvent`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EngineEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/workspaces/{workspaceId}/chats:
    get:
      operationId: listWorkspaceChats
      summary: List Workspace Chats
      description: Lists active, sleeping, and pending chats. Chats created while the workspace is preparing remain visible while startup completes.
      tags:
      - Replica
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Workspace chats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceChatListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createWorkspaceChat
      summary: Create Workspace Chat
      description: Creates a chat immediately. For preparing or sleeping workspaces, the chat stays visible and is created in the engine after startup completes. Archived and error workspaces return 409.
      tags:
      - Replica
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkspaceChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/workspaces/{workspaceId}/chats/{chatId}/messages:
    post:
      operationId: sendWorkspaceChatMessage
      summary: Send Workspace Chat Message
      description: Accepts a message immediately. Messages sent while a workspace is preparing or sleeping are queued server-side and delivered in order after startup completes. Archived and error workspaces return 409.
      tags:
      - Replica
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: chatId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendWorkspaceChatMessageRequest'
      responses:
        '200':
          description: Message accepted by an active workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendWorkspaceChatMessageResponse'
        '202':
          description: Message queued while the workspace starts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendWorkspaceChatMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/workspaces/{workspaceId}/messages/deferred:
    post:
      operationId: sendDeferredWorkspaceMessage
      summary: Send Deferred Workspace Message
      description: Creates or selects a chat, queues a message, and wakes a preparing or sleeping workspace. The queued message remains available while startup completes. Archived and error workspaces return 409.
      tags:
      - Replica
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDeferredWorkspaceMessageRequest'
      responses:
        '202':
          description: Message queued and workspace waking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDeferredWorkspaceMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/workspaces/{workspaceId}/archive:
    post:
      operationId: archiveWorkspace
      summary: Archive Workspace
      description: Archives a workspace in the authenticated organization. Archived workspaces stay paused and can be woken later.
      tags:
      - Replica
      parameters:
      - name: workspaceId
        in: path
        description: Workspace UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Workspace archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveWorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/workspaces/{workspaceId}/sleep:
    post:
      operationId: sleepWorkspace
      summary: Sleep Workspace
      description: Forces an active workspace in the authenticated organization to sleep, stopping compute charges. Slept workspaces can be woken later. A no-op for already-sleeping or archived workspaces; returns 409 for preparing or error workspaces.
      tags:
      - Replica
      parameters:
      - name: workspaceId
        in: path
        description: Workspace UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Workspace slept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepWorkspaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HooksResponse:
      type: object
      description: Hook execution logs for a replica
      properties:
        warm_hooks:
          type: object
          properties:
            logs:
              type: array
              items:
                $ref: '#/components/schemas/WarmHookLogEntry'
          required:
          - logs
        start_hooks:
          type: object
          properties:
            logs:
              type: array
              items:
                $ref: '#/components/schemas/StartHookLogEntry'
          required:
          - logs
      required:
      - warm_hooks
      - start_hooks
    CanvasItemKind:
      type: string
      enum:
      - markdown
      - html
      - image
      - video
      - audio
      - other
      description: The kind of Canvas item, inferred from its file extension.
    ClaudeAgentEvent:
      type: object
      description: A streaming event from the Claude Code agent. The `type` field is prefixed with `claude-` followed by the SDK message type.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        type:
          type: string
          enum:
          - claude-assistant
          - claude-user
          - claude-result
          - claude-system
          description: Claude event type. `claude-assistant` contains model output (text, thinking, tool use). `claude-user` contains tool results. `claude-result` signals turn completion or errors. `claude-system` contains system-level messages.
        payload:
          $ref: '#/components/schemas/ClaudeEventPayload'
      required:
      - timestamp
      - type
      - payload
    EngineChatSummary:
      type: object
      description: Summary of a chat session as reported by the engine
      properties:
        id:
          type: string
          description: Unique chat session ID
        provider:
          type: string
          enum:
          - claude
          - codex
          - cursor
          - opencode
          - pi
          description: Coding agent provider
        title:
          type: string
          description: Chat title
        createdAt:
          type: string
          format: date-time
          description: When the chat was created
        updatedAt:
          type: string
          format: date-time
          description: When the chat was last updated
        processing:
          type: boolean
          description: Whether the chat is currently doing work — either processing a foreground message or running background/spawned-agent tasks
        awaitingInput:
          type: boolean
          description: The agent has issued an interactive tool call (e.g. ExitPlanMode, AskUserQuestion) and is paused until the user resolves it. `processing` stays true while this is true.
        parentChatId:
          type:
          - string
          - 'null'
          description: ID of the parent chat, if this is a sub-chat
        lastMessageText:
          type:
          - string
          - 'null'
          description: Preview of the most recent input message sent to this chat.
      required:
      - id
      - provider
      - title
      - createdAt
      - updatedAt
      - processing
      - parentChatId
    WorkspaceConfig:
      type: object
      description: Workspace behavior configuration. Missing capabilities and preferences default to disabled.
      properties:
        capabilities:
          type: object
          description: Actions this workspace is allowed to perform. Automations snapshot this config onto each workspace they create; API-created replicas can set it at creation time.
          properties:
            pr_followups:
              type: boolean
              description: Whether matching pull requests can receive Replicas follow-up actions. Defaults to true for workspaces created from the dashboard, Slack, Linear, GitHub, or the API, and to false for workspaces created from an automation. When enabled, later CI and review-comment replies can route back to this workspace.
          additionalProperties: true
        preferences:
          type: object
          description: Workspace behavior preferences that do not grant new action permissions.
          properties:
            keep_open_on_pr_merge:
              type: boolean
              description: Whether the workspace should remain open after its last tracked PR is merged. Defaults to false.
              default: false
            keep_open_on_pr_close:
              type: boolean
              description: Whether the workspace should remain open after its last tracked PR is closed without merging. Defaults to false.
              default: false
          additionalProperties: true
        provisioning_error:
          type: object
          description: Setup/provisioning or wake/resume failure captured when the workspace remains queryable in `error` status. Some wake/resume failures can be retried; the `error` status can also represent an unrecoverable sandbox failure.
          properties:
            message:
              type: string
              description: Underlying setup failure message, such as repository clone/auth errors.
          additionalProperties: true
      additionalProperties: true
    EngineRepoDiff:
      type: object
      description: Git diff statistics for a repository
      properties:
        added:
          type: integer
          description: Number of lines added
        removed:
          type: integer
          description: Number of lines removed
        fullDiff:
          type: string
          description: Full diff content
      required:
      - added
      - removed
    QueuedMessageInfo:
      type: object
      description: A message waiting in a chat queue.
      properties:
        id:
          type: string
          description: Unique queued message ID.
        message:
          type: string
          description: Queued message text.
        queuedAt:
          type: string
          format: date-time
          description: When the message was queued.
        senderUserId:
          type: string
          description: Identifier of the user who queued the message.
        senderEmail:
          type: string
          description: Email of the user who queued the message.
        senderDisplayName:
          type: string
          description: Display name of the user who queued the message.
      required:
      - id
      - message
      - queuedAt
    CanvasListResponse:
      type: object
      description: List of items the agent has dropped into the Canvas.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CanvasItem'
      required:
      - items
    ImageContent:
      type: object
      description: An image attachment for messages
      properties:
        type:
          type: string
          const: image
          description: Content type, always 'image'
        source:
          type: object
          description: Image source data
          oneOf:
          - type: object
            properties:
              type:
                type: string
                const: base64
              media_type:
                type: string
                enum:
                - image/png
                - image/jpeg
                - image/gif
                - image/webp
                description: MIME type of the image
              data:
                type: string
                description: Base64-encoded image data
            required:
            - type
            - media_type
            - data
          - type: object
            properties:
              type:
                type: string
                const: url
              url:
                type: string
                format: uri
                description: URL to the image
            required:
            - type
            - url
      required:
      - type
      - source
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        details:
          type:
          - string
          - 'null'
          description: Additional error details
      required:
      - error
    CodexAgentEvent:
      type: object
      description: A streaming event from the Codex CLI agent. Uses either `event_msg` for high-level messages or `response_item` for structured response items.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        type:
          type: string
          enum:
          - event_msg
          - response_item
          description: '`event_msg` carries high-level messages (user input, reasoning). `response_item` carries structured responses (assistant messages, function calls, tool calls).'
        payload:
          $ref: '#/components/schemas/CodexEventPayload'
      required:
      - timestamp
      - type
      - payload
    CreateReplicaRequest:
      type: object
      description: Request body for creating a new replica
      properties:
        name:
          type: string
          description: Human-readable name for the replica. Must not contain whitespace.
          pattern: ^\S+$
        message:
          type: string
          description: Initial message to send to the coding agent
        environment_id:
          type: string
          format: uuid
          description: ID of the environment to use. The server derives the repository or repository set from the environment binding. Required unless `repository_set_id` or `repository_ids` is provided for backwards compatibility.
        repository_set_id:
          type: string
          format: uuid
          deprecated: true
          description: 'Deprecated. Use `environment_id` instead. Provided for backwards compatibility: the server resolves the first environment bound to this repository set.'
        repository_ids:
          type: array
          items:
            type: string
            format: uuid
          deprecated: true
          description: 'Deprecated. Use `environment_id` instead. Provided for backwards compatibility: the server resolves the first environment bound to one of the given repositories.'
        coding_agent:
          type: string
          description: Coding agent to use
          enum:
          - claude
          - codex
          - cursor
          - opencode
          - pi
          default: claude
        model:
          type: string
          description: Model to use for the coding agent. Pi and Opencode accept z-ai/glm-5.2, minimax/minimax-m3, xiaomi/mimo-v2.5-pro, and moonshotai/kimi-k2.6 through OpenRouter.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageContent'
          description: Images to attach to the initial message
        lifecycle_policy:
          type: string
          description: Lifecycle policy for the replica
          enum:
          - default
          - archive_when_done
          - sleep_when_done
          - delete_after_inactivity
        config:
          $ref: '#/components/schemas/WorkspaceConfig'
        plan_mode:
          type: boolean
          description: Whether to run the initial message in plan mode. Leading `/plan` in the message is also detected and stripped.
        goal_mode:
          type: boolean
          description: Whether to set the initial message as the active Codex goal. Leading `/goal` in the message is also detected and stripped.
        fast_mode:
          type: boolean
          description: Whether to run the initial message in fast mode. Leading `/fast` in the message is also detected and stripped.
        thinking_level:
          type: string
          description: 'Thinking/reasoning level. Controls how much effort the agent puts into reasoning. `ultra` is Codex-only; `ultracode` is Claude Code-only. Falls back to provider default when omitted (Claude default: high, Codex default: medium, Cursor default: medium, Opencode default: medium, Pi default: model default).'
          enum:
          - low
          - medium
          - high
          - xhigh
          - max
          - ultra
          - ultracode
        webhook_url:
          description: 'Callback target for `replica.ready`, `replica.turn_completed`, `replica.deleted`, and `replica.error` events. `replica.deleted` fires only on explicit deletion; closing a linked PR or issue now archives the workspace silently, so automated cleanup no longer emits it. `replica.error` is emitted when the workspace enters `error` state and remains queryable; the payload includes the failure message. Some wake/resume errors can be retried with the wake endpoint. Pass a bare URL string or `{ url, secret }`; with a secret the platform sets `X-Replicas-Signature: sha256=<hex HMAC>` on every delivery.'
          oneOf:
          - type: string
            format: uri
          - $ref: '#/components/schemas/ReplicaWebhookConfig'
        size:
          type: string
          description: Compute size for this replica. `small` (2 vCPU, 8 GB memory, 20 GB disk) bills at $0.008/min; `large` (4 vCPU, 16 GB memory, 32 GB disk) bills at $0.016/min. Defaults to `small` when omitted.
          enum:
          - small
          - large
      required:
      - name
      - message
    OpencodeAgentEvent:
      type: object
      description: A streaming event from the Opencode agent. Opencode events are normalized with an `opencode-` prefixed type and an open provider payload.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        type:
          type: string
          pattern: ^opencode-
          description: Opencode event type. Common values include `opencode-message.updated`, `opencode-session.idle`, `opencode-error`, and `opencode-part-*` events.
        payload:
          type: object
          description: Opencode event payload. Shape depends on the parent event `type`; Opencode payload sub-shapes are not yet formally specified.
          additionalProperties: true
      required:
      - timestamp
      - type
      - payload
    ClaudeMessage:
      type: object
      description: A Claude SDK message containing an array of content blocks.
      properties:
        content:
          type: array
          description: Ordered list of content blocks produced or consumed by the model.
          items:
            $ref: '#/components/schemas/ClaudeContentBlock'
    ListReplicasResponse:
      type: object
      properties:
        replicas:
          type: array
          items:
            $ref: '#/components/schemas/ReplicaListItem'
          description: Array of replicas
        total:
          type: integer
          description: Total number of replicas matching the filters
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Number of items per page
        total_pages:
          type: integer
          description: Total number of pages
      required:
      - replicas
      - total
      - page
      - limit
      - total_pages
    ReplicaListItem:
      type: object
      description: A replica item in list responses
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the replica
        name:
          type: string
          description: Human-readable name for the replica. Must not contain whitespace.
          pattern: ^\S+$
        status:
          type: string
          description: Current status of the replica
          enum:
          - active
          - sleeping
          - archived
          - preparing
          - error
        source:
          type: string
          description: How the replica was created
          enum:
          - api
          - dashboard
          - slack
          - linear
          - github
          - gitlab
          - automation
        created_at:
          type: string
          format: date-time
          description: Timestamp when the replica was created
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the last activity on the replica
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryReference'
          description: Repositories associated with the replica
        pull_requests:
          type: array
          items:
            $ref: '#/components/schemas/PullRequest'
          description: Associated pull requests
      required:
      - id
      - name
      - status
      - source
      - created_at
      - last_activity_at
      - repositories
      - pull_requests
    CursorAgentEvent:
      type: object
      description: A streaming event from the Cursor agent. Cursor events are normalized with a `cursor-` prefixed type and a provider payload.
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        type:
          type: string
          enum:
          - cursor-assistant
          - cursor-thinking
          - cursor-tool_call
          - cursor-task
          - cursor-status
          - cursor-error
          description: Cursor event type. `cursor-assistant` contains model output, `cursor-thinking` contains reasoning text, `cursor-tool_call` contains tool progress/results, `cursor-task` contains task updates, `cursor-status` contains run status, and `cursor-error` contains failure details.
        payload:
          type: object
          description: Cursor event payload. Shape depends on the parent event `type`; Cursor payload sub-shapes are not yet formally specified.
          additionalProperties: true
      required:
      - timestamp
      - type
      - payload
    CodexEventPayload:
      description: Payload of a Codex CLI agent event. Shape depends on the parent event `type`.
      oneOf:
      - $ref: '#/components/schemas/CodexEventMsgPayload'
      - $ref: '#/components/schemas/CodexResponseItemPayload'
      discriminator:
        propertyName: type
        mapping:
          user_message: '#/components/schemas/CodexEventMsgPayload'
          agent_reasoning: '#/components/schemas/CodexEventMsgPayload'
          message: '#/components/schemas/CodexResponseItemPayload'
          function_call: '#/components/schemas/CodexResponseItemPayload'
          function_call_output: '#/components/schemas/CodexResponseItemPayload'
          custom_tool_call: '#/components/schemas/CodexResponseItemPayload'
          custom_tool_call_output: '#/components/schemas/CodexResponseItemPayload'
    ClaudeEventPayload:
      type: object
      description: Payload of a Claude Code agent event, wrapping the Claude SDK message.
      properties:
        type:
          type: string
          description: Original SDK message type (e.g. `assistant`, `user`, `result`)
        subtype:
          type: string
          description: Present on `claude-result` events; `success` indicates a clean turn completion. Any other value (e.g. `error`) signals a failed turn even when `is_error` is false.
        parent_tool_use_id:
          type:
          - string
          - 'null'
          description: If this message is the result of a sub-agent tool call, the parent tool_use ID
        message:
          $ref: '#/components/schemas/ClaudeMessage'
        is_error:
          type: boolean
          description: Present on `claude-result` events; true if the turn ended with an error
        errors:
          type: array
          items:
            type: string
          description: Array of error messages, present on `claude-result` events when `is_error` is true
      additionalProperties: true
    EngineEvent:
      type: object
      description: A real-time event from the replica engine. All events share a common envelope with `id`, `ts`, `type`, and `payload` fields. The `type` field discriminates between event variants.
      oneOf:
      - title: engine.ready
        type: object
        description: Engine initialization complete.
        properties:
          id:
            type: string
            description: Unique event ID
          ts:
            type: string
            format: date-time
            description: ISO 8601 timestamp
          type:
            type: string
            const: engine.ready
          payload:
            type: object
            properties:
              version:
                type: string
                description: Engine protocol version
                example: v1
            required:
            - version
        required:
        - id
        - ts
        - type
        - payload
      - title: engine.status.changed
        type: object
        description: Engine status snapshot changed (uptime, active sessions, chat counts, etc.).
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: engine.status.changed
          payload:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/EngineStatusSnapshot'
            required:
            - status
        required:
        - id
        - ts
        - type
        - payload
      - title: repo.discovered
        type: object
        description: New repositories discovered in the workspace.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: repo.discovered
          payload:
            type: object
            properties:
              repos:
                type: array
                items:
                  $ref: '#/components/schemas/EngineRepoState'
            required:
            - repos
        required:
        - id
        - ts
        - type
        - payload
      - title: repo.status.changed
        type: object
        description: Repository status changed (branch, diff, PR URL, start hooks status).
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: repo.status.changed
          payload:
            type: object
            properties:
              repos:
                type: array
                items:
                  $ref: '#/components/schemas/EngineRepoState'
            required:
            - repos
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.created
        type: object
        description: A new chat session was created.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.created
          payload:
            type: object
            properties:
              chat:
                $ref: '#/components/schemas/EngineChatSummary'
              clientRequestId:
                type: string
                description: Echo of the `clientRequestId` from the create request, if one was provided
            required:
            - chat
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.updated
        type: object
        description: A chat session was updated (e.g. title or processing state changed).
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.updated
          payload:
            type: object
            properties:
              chat:
                $ref: '#/components/schemas/EngineChatSummary'
            required:
            - chat
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.deleted
        type: object
        description: A chat session was deleted.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.deleted
          payload:
            type: object
            properties:
              chatId:
                type: string
                description: ID of the deleted chat
            required:
            - chatId
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.turn.accepted
        type: object
        description: A message was accepted and queued for processing.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.turn.accepted
          payload:
            type: object
            properties:
              chatId:
                type: string
                description: Chat session ID
              messageId:
                type: string
                description: Unique message ID
              queued:
                type: boolean
                description: Whether the message was queued (true) or processing immediately (false)
              position:
                type: integer
                description: Position in the queue (0 if processing immediately)
            required:
            - chatId
            - messageId
            - queued
            - position
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.turn.started
        type: object
        description: The coding agent started processing a message.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.turn.started
          payload:
            type: object
            properties:
              chatId:
                type: string
                description: Chat session ID
              messageId:
                type: string
                description: Message being processed
            required:
            - chatId
            - messageId
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.turn.delta
        type: object
        description: A streaming delta from the coding agent (tool calls, text output, etc.).
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.turn.delta
          payload:
            type: object
            properties:
              chatId:
                type: string
                description: Chat session ID
              event:
                $ref: '#/components/schemas/AgentEvent'
            required:
            - chatId
            - event
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.turn.completed
        type: object
        description: The coding agent finished processing a message.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.turn.completed
          payload:
            type: object
            properties:
              chatId:
                type: string
                description: Chat session ID
              isComplete:
                type: boolean
                description: Whether the turn completed fully (false if interrupted or errored)
            required:
            - chatId
            - isComplete
        required:
        - id
        - ts
        - type
        - payload
      - title: chat.interrupted
        type: object
        description: A chat turn was interrupted.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: chat.interrupted
          payload:
            type: object
            properties:
              chatId:
                type: string
                description: Chat session ID
              interrupted:
                type: boolean
                description: Whether the interruption was successful
              queue:
                type: array
                items:
                  type: string
                description: Remaining message IDs in the queue
            required:
            - chatId
            - interrupted
            - queue
        required:
        - id
        - ts
        - type
        - payload
      - title: hooks.started
        type: object
        description: Hooks started executing.
        properties:
          id:
            type: string
          ts:
            type: string
            format: date-time
          type:
            type: string
            const: hooks.started
