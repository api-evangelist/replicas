    SendReplicaMessageRequest:
      type: object
      description: Request body for sending a message to a replica
      properties:
        message:
          type: string
          description: Message to send to the coding agent
        coding_agent:
          type: string
          description: Coding agent to use
          enum:
          - claude
          - codex
          - cursor
          - opencode
          - pi
        chat_id:
          type: string
          description: Target a specific chat session
        model:
          type: string
          description: Model to use for this message. Pi and Opencode accept z-ai/glm-5.2, minimax/minimax-m3, xiaomi/mimo-v2.5-pro, and moonshotai/kimi-k2.6 through OpenRouter.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageContent'
          description: Images to attach to the message
        plan_mode:
          type: boolean
          description: Whether to run in plan mode. Leading `/plan` in the message is also detected and stripped.
        goal_mode:
          type: boolean
          description: Whether to set the message as the active Codex goal. Leading `/goal` in the message is also detected and stripped.
        fast_mode:
          type: boolean
          description: Whether to run in fast mode. Leading `/fast` in the message is also detected and stripped.
        thinking_level:
          type: string
          description: 'Thinking/reasoning level. Controls how much effort the agent puts into reasoning. `ultra` is Codex-only; `ultracode` is Claude Code-only. Falls back to provider default when omitted (Claude default: high, Codex default: medium, Cursor default: medium, Opencode default: medium, Pi default: model default).'
          enum:
          - low
          - medium
          - high
          - xhigh
          - max
          - ultra
          - ultracode
        senderUserId:
          type: string
          description: Identifier of the user sending this message. When the request is authenticated via dashboard auth, the server overrides this with the authenticated user's id so team workspaces can attribute messages to the actual sender.
        senderEmail:
          type: string
          description: Email of the user sending this message. When the request is authenticated via dashboard auth, the server overrides this with the authenticated user's email.
