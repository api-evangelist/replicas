aid: replicas
name: Replicas
description: >-
  Replicas (tryreplicas.com), a Y Combinator (Spring 2026) company, runs
  end-to-end background coding agents in isolated cloud sandboxes. Teams delegate
  engineering tasks - from Slack, Linear, GitHub, GitLab, Sentry, the web
  dashboard, a CLI, or a native macOS app - to frontier coding agents (Claude
  Code, Codex, Cursor, OpenCode) that work in their own VM-backed workspaces with
  databases, environment variables, files, skills, and MCP servers, then open
  pull requests for review. The Replica API (OpenAPI 3.1, base
  https://api.tryreplicas.com/v1, bearer API-key auth) exposes environments,
  replicas/workspaces, chats, event streaming (SSE), repositories, automations
  (cron + webhook triggered), and Google Search Console tooling, plus an official
  hosted MCP server at api.tryreplicas.com/v1/mcp.
